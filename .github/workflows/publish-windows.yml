name: 发布已验证的 Windows 构建

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 已成功的 Windows 构建任务编号
        required: true
        type: string
      release_tag:
        description: 必须与构建提交一致的现有版本标签
        required: true
        default: v1.0.46
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 验证构建来源及标签
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success"
            and .head_repository.full_name == $repo
            and .path == ".github/workflows/build-windows.yml"
          ' <<< "$info"
          sha=$(jq -r .head_sha <<< "$info")
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          [[ "$sha" == "$tag_sha" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: 获取已验证安装包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: Satelite-Windows-${{ steps.verify.outputs.sha }}
          path: release
      - name: 获取已验证便携包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: Satelite-Windows-Portable-${{ steps.verify.outputs.sha }}
          path: release
      - name: 更新 Release 资产与发布说明
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_SHA: ${{ steps.verify.outputs.sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # 替换前再验证一次标签，避免并发更新后上传错版本。
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" == "$BUILD_SHA" ]]
          notes="docs/release-${RELEASE_TAG#v}.md"
          test -f "$notes"
          test -f "release/Satelite_${RELEASE_TAG#v}_x64-setup.exe"
          test -f "release/Satelite_${RELEASE_TAG#v}_x64_portable.zip"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          asset_metadata() {
            # 唯一查询参数避开旧资产列表缓存；严格按同名资产操作。
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(date +%s%N)" |
              jq -c --arg name "$1" '[.[] | select(.name == $name)]'
          }
          for file in release/*.exe release/*.zip; do
            name=$(basename "$file")
            expected=$(sha256sum "$file" | cut -d ' ' -f 1)
            echo "$expected  $file"
            metadata=$(asset_metadata "$name")
            if ! jq -e --arg digest "sha256:$expected" 'length == 1 and .[0].digest == $digest and .[0].state == "uploaded"' <<< "$metadata" >/dev/null; then
              while IFS= read -r asset_id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done < <(jq -r '.[].id' <<< "$metadata")
              # 上传已成功但响应中断时，CLI 重试可能返回同名 422。
              # 后面核对服务端摘要，只有与本次验证产物相同才接受。
              if ! gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"; then
                echo "上传返回错误，核对服务端同名资产摘要：$name"
              fi
            fi
            verified=false
            for attempt in 1 2 3 4 5; do
              metadata=$(asset_metadata "$name")
              if jq -e --arg digest "sha256:$expected" 'length == 1 and .[0].digest == $digest and .[0].state == "uploaded"' <<< "$metadata" >/dev/null; then
                verified=true
                break
              fi
              sleep 2
            done
            [[ "$verified" == true ]] || { echo "资产摘要不匹配：$name" >&2; exit 1; }
          done
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" == "$BUILD_SHA" ]]
          notes_file=$(mktemp "$RUNNER_TEMP/satelite-release-notes.XXXXXX")
          trap 'rm -f -- "$notes_file"' EXIT
          { cat "$notes"; printf '\n\n构建提交：%s\n验证任务：https://github.com/%s/actions/runs/%s\n' "$BUILD_SHA" "$GITHUB_REPOSITORY" "$BUILD_RUN_ID"; } > "$notes_file"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
          sha256sum release/*.exe release/*.zip
