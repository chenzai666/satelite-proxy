name: 服务诊断规则与连接证据验证
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/resources/bin/windows-amd64
          key: windows-core-${{ hashFiles('scripts/fetch-bundled-core-windows-amd64.ps1') }}
      - name: 准备 Tauri 测试资源
        shell: bash
        run: |
          bash scripts/ci-fetch-with-retry.sh scripts/fetch-bundled-core-windows-amd64.ps1
          mkdir -p src-tauri/resources/rule-sets
      - name: 服务规则与连接证据测试
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.singbox-windows.conf.json -Raw
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::service_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib config::builder::tests::builds_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib config::mihomo::tests::service_diagnostic_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib api::clash_api::parse_tests::lists_only_policy_groups_in_clash_order
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib runtime::service_diagnostic_port_tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::service_route::live_tests:: -- --ignored
