name: Windows 构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v1.0.43"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: 验证固定版本
        shell: pwsh
        run: ./scripts/check-fixed-version.ps1

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: 缓存固定版本内核资源
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/resources/bin/windows-amd64
          key: windows-core-${{ hashFiles('scripts/fetch-bundled-core-windows-amd64.ps1') }}

      - name: 预取内核并在网络失败时退避重试
        shell: bash
        run: bash scripts/ci-fetch-with-retry.sh scripts/fetch-bundled-core-windows-amd64.ps1

      - name: 构建 NSIS 安装包
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Bundle nsis

      - name: 构建便携版
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Bundle portable

      - name: 确认弹窗安全回归测试
        shell: pwsh
        run: node --test scripts/test-confirm-action.mjs scripts/test-rules-input.mjs

      - name: 规则侧栏浏览器回归测试
        shell: pwsh
        run: |
          $uiDeps = Join-Path $env:RUNNER_TEMP 'satelite-ui-tests'
          npm install --prefix $uiDeps --no-audit --no-fund playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $uiDeps 'node_modules/playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_MODULE = Join-Path $uiDeps 'node_modules/playwright/index.mjs'
          $server = Start-Process node -ArgumentList @('node_modules/vite/bin/vite.js', '--host', '127.0.0.1', '--port', '1440', '--strictPort') -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest 'http://127.0.0.1:1440/scripts/ui-smoke/index.html' -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'UI 测试服务未就绪' }
            node scripts/test-rules-sidebar.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }

      - name: 保存规则侧栏测试截图
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rules-sidebar-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 运行 Rust 单元测试
        shell: pwsh
        run: |
          # 默认安装包只内置 sing-box。cargo test 也必须使用相同覆盖配置，
          # 否则 Tauri build.rs 会按基础配置查找未下载的 Xray/Mihomo 文件。
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.singbox-windows.conf.json -Raw
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Windows 剪贴板 Unicode 回归测试
        shell: pwsh
        run: |
          # 仅在临时 CI runner 覆盖剪贴板，不在用户机器运行此 ignored 测试。
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.singbox-windows.conf.json -Raw
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib tray::clipboard_tests::clipboard_roundtrip_preserves_unicode -- --ignored

      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Satelite-Windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传便携版
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Satelite-Windows-Portable-${{ github.sha }}
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    if: github.ref == 'refs/tags/v1.0.43'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 检出发布说明
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Satelite-Windows-${{ github.sha }}
          path: release

      - name: 下载 Windows 便携版
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Satelite-Windows-Portable-${{ github.sha }}
          path: release

      - name: 创建 Release 并上传 Windows 产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file docs/release-1.0.43.md \
              --title "Satelite $GITHUB_REF_NAME"
          fi
          # gh release upload --clobber 可能因按标签查询的缓存漏掉旧资产而报 422。
          # 按 Release ID 枚举并删除同名资产，再上传本次已验证产物。
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          for file in release/*.exe release/*.zip; do
            name=$(basename "$file")
            asset_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id")
            for asset_id in $asset_ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
          done
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.zip --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file docs/release-1.0.43.md
