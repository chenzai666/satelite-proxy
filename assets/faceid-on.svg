<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Stroke-based redraw of the original Sketch fill paths, thickened from
         ~4.1 to 7. The corner brackets shrink inward as the stroke grows so
         the 24x24 corner span and the 80x80 bounds stay fixed; the mouth
         arc's outer contour is pinned so the heavier frown clears the nose. -->
    <title>Face ID</title>
    <desc>Face ID smiley, proxy running. Mint smile.</desc>
    <g id="Face-ID" fill="none" stroke="#2EBE84" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <g id="Corners">
            <path d="M 3.50 20.50 L 3.50 13.03 A 9.53 9.53 0 0 1 13.03 3.50 L 20.50 3.50"/>
            <path d="M 3.50 20.50 L 3.50 13.03 A 9.53 9.53 0 0 1 13.03 3.50 L 20.50 3.50" transform="translate(80,0) scale(-1,1)"/>
            <path d="M 3.50 20.50 L 3.50 13.03 A 9.53 9.53 0 0 1 13.03 3.50 L 20.50 3.50" transform="translate(0,80) scale(1,-1)"/>
            <path d="M 3.50 20.50 L 3.50 13.03 A 9.53 9.53 0 0 1 13.03 3.50 L 20.50 3.50" transform="translate(80,80) scale(-1,-1)"/>
        </g>
        <path id="Eye-L" d="M 23.75 30.21 L 23.75 35.93"/>
        <path id="Eye-R" d="M 56.74 30.21 L 56.74 35.93"/>
        <path id="Nose" d="M 42.11 30.18 L 42.11 45.4 Q 42.11 48.42 38.6 48.42 L 37.19 48.42"/>
        <path id="Mouth" d="M 27.35 56.08 A 18.72 18.72 0 0 0 52.65 56.08"/>
    </g>
</svg>
