# Minimal Clash-style subscription used in integration tests / manual paste.
proxies:
  - name: "SS-HK"
    type: ss
    server: ss.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "secret"
    udp: true

  - name: "VMess-WS"
    type: vmess
    server: vm.example.com
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: cdn.example.com
    network: ws
    ws-opts:
      path: /ray
      headers:
        Host: cdn.example.com

  - name: "VLESS-Reality"
    type: vless
    server: vl.example.com
    port: 443
    uuid: 22222222-2222-2222-2222-222222222222
    tls: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    network: tcp
    flow: xtls-rprx-vision
    reality-opts:
      public-key: pubkey123
      short-id: abcd

  - name: "Trojan-1"
    type: trojan
    server: tj.example.com
    port: 443
    password: "tjpass"
    sni: tj.example.com

  - name: "Hy2"
    type: hysteria2
    server: hy2.example.com
    port: 443
    password: "hy2pass"
    sni: hy2.example.com
    skip-cert-verify: true

  - name: "unsupported-ssr"
    type: ssr
    server: x.example.com
    port: 1
    password: x
    cipher: x
    protocol: origin
    obfs: plain
